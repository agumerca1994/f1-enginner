# Production stack, built by Easypanel from GitHub main (same pattern as registrapp).
# Service names are prefixed: every Easypanel app shares the external `easypanel`
# network, so a plain `db` would collide with other projects' hostnames.
services:
  f1eng-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineer}
      POSTGRES_USER: ${POSTGRES_USER:-engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Easypanel > Environment}
    volumes:
      - f1eng-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engineer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  f1eng-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-engineer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@f1eng-db:5432/${POSTGRES_DB:-engineer}
      ENVIRONMENT: production
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in Easypanel > Environment}
      APP_DOMAIN: ${APP_DOMAIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      INTERNAL_LOG_KEY: ${INTERNAL_LOG_KEY:?set INTERNAL_LOG_KEY in Easypanel > Environment}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_B64: ${FIREBASE_CREDENTIALS_B64:-}
      CAPTURE_DIR: /data/captures
      # Race engineer: without a key it runs on rules (no AI).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENGINEER_TIER: ${ENGINEER_TIER:-standard}
    volumes:
      - f1eng-captures:/data/captures
    restart: unless-stopped
    depends_on:
      f1eng-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.f1eng-api.rule=Host(`${API_DOMAIN:?set API_DOMAIN}`)"
      - "traefik.http.routers.f1eng-api.tls=true"
      - "traefik.http.routers.f1eng-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.f1eng-api.loadbalancer.server.port=8000"

  f1eng-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?set API_DOMAIN}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?set NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?set NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?set NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?set NEXT_PUBLIC_FIREBASE_APP_ID}
    restart: unless-stopped
    depends_on:
      - f1eng-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.f1eng-web.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`)"
      - "traefik.http.routers.f1eng-web.tls=true"
      - "traefik.http.routers.f1eng-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.f1eng-web.loadbalancer.server.port=3000"

volumes:
  f1eng-db-data:
  f1eng-captures:

networks:
  default:
    external: true
    name: easypanel
