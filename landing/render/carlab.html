<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#15171b}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script></head>
<body><script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { buildCar } from "./car3d.js";
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x15171b);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.add(new THREE.DirectionalLight(0xffffff, 2).translateX(4).translateY(8).translateZ(5));
const { car } = buildCar({ body: 0xd8301c, accent: 0x15171b }); s.add(car);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const [x, y, z] = (q.get("c") || "6,2.4,6").split(",").map(Number); cam.position.set(x, y, z); cam.lookAt(0.2, 0.35, 0);
r.render(s, cam); window.__ready = true;
</script></body></html>
