<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script></head>
<body><canvas id="c"></canvas><script type="module">
import { buildScene } from "./scene.js";
const q = new URLSearchParams(location.search);
const W = Number(q.get("w") || 1920), H = Number(q.get("h") || 1080);
const c = document.getElementById("c");
const renderAt = await buildScene(c, W, H);
window.frameAt = (t) => { renderAt(t); return c.toDataURL("image/jpeg", 0.93); };
window.__ready = true;
</script></body></html>
