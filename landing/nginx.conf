server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
